# Configuration SonarCloud pour cesizen-web (Laravel).
# A adapter une fois le projet cree sur https://sonarcloud.io :
# - sonar.organization = la cle de ton organisation SonarCloud
# - sonar.projectKey   = la cle du projet (proposee automatiquement a la creation)
sonar.organization=loanmancisidor
sonar.projectKey=loanmancisidor_CesizenApp

sonar.sources=app
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**
sonar.php.coverage.reportPaths=coverage.xml
