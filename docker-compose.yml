services:
  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      APP_NAME: CESIZen
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: sqlite
      SESSION_DRIVER: database
