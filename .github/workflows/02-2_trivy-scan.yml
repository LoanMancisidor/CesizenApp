name: 02-2 - Deployment - Trivy Scan

on:
  workflow_call

env:
  REGISTRY: ghcr.io

jobs:
  Trivy-Scan_Web:
    runs-on: ubuntu-22.04

    steps:
      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        run: echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Trivy Scan Web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-web:canary
          format: table
          exit-code: '1'
          output: trivy-results-web.txt
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results-web
          path: trivy-results-web.txt
          retention-days: 1
