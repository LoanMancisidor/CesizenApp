name: 02-4 - Deploy - ZAP Scan

on:
  workflow_call:
    inputs:
      target-host:
        required: true
        type: string

jobs:
  Web_Zap_Scan:
    runs-on: ubuntu-latest

    steps:
      - name: Run ZAP Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://${{ inputs.target-host }}'
          fail_action: true
          artifact_name: 'web_zap_scan'
          issue_title: 'ZAP Web Scan Report'
